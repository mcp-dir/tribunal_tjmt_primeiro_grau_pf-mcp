# Smithery configuration for Tribunal TJMT: Certidão do 1º Grau (Pessoa Física)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tribunal_tjmt_primeiro_grau_pf

name: tribunal_tjmt_primeiro_grau_pf-mcp
displayName: "Tribunal TJMT: Certidão do 1º Grau (Pessoa Física)"
description: >
  Tribunal TJMT: Certidão do 1º Grau (Pessoa Física), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tribunal_tjmt_primeiro_grau_pf-mcp
repository: https://github.com/mcp-dir/tribunal_tjmt_primeiro_grau_pf-mcp

tags:
  - tribunal_tjmt_primeiro_grau_pf
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tribunal_tjmt_primeiro_grau_pf

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tribunal_tjmt_primeiro_grau_pf/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
